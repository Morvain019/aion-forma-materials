name: Publish Aion Forma library

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

env:
  RELEASE_URL: https://github.com/Morvain019/aion-forma-materials/releases/download/v1.0.0
  ARCHIVE: aion-forma-library.zip
  EXPECTED_SHA256: 22690519ea2d67edf008516e9bde4df96a9f1dd4516c693d75696551033a98a3

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Download and verify the release archive
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA256" =~ ^[0-9a-f]{64}$ ]]
          curl --fail --location --retry 3 --output "$ARCHIVE" "$RELEASE_URL/$ARCHIVE"
          printf '%s  %s\n' "$EXPECTED_SHA256" "$ARCHIVE" | sha256sum --check --strict -

      - name: Unpack the static library
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, pathlib, stat, zipfile
          target = pathlib.Path('_site')
          target.mkdir()
          with zipfile.ZipFile(os.environ['ARCHIVE']) as archive:
              for item in archive.infolist():
                  path = pathlib.PurePosixPath(item.filename)
                  if path.is_absolute() or '..' in path.parts or stat.S_ISLNK(item.external_attr >> 16):
                      raise SystemExit('Archive contains an unsupported path or symbolic link.')
              archive.extractall(target)
          for required in ('index.html', 'reference.txt', 'reference.json'):
              if not (target / required).is_file():
                  raise SystemExit(f'Missing library file at archive root: {required}')
          PY

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          retention-days: 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
